{% include base_path %}
<header class="site-head">
  <div class="in">
    <a class="brand" href="{{ base_path }}/">{{ site.title }}</a>
    <nav aria-label="Main"><ul>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %}
        <li><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} class="on"{% endif %}>{{ link.title }}</a></li>
      {% endfor %}
    </ul></nav>
  </div>
</header>
